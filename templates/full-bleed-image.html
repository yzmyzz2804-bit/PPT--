<!--
@template: full-bleed-image
@version: 1.0 分章色体系
@slot: ch_*
@description: 全屏满版图页 - 图片铺满画布,底部深色渐变横带承载标题与图说,适合卫星图/场地图等大场景
@required_fields: title, image
@optional_fields: tag, caption, location
@image_rule: image 满版 cover;为空时整页占位相框
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link rel="stylesheet" href="../base.css">
<style>
  .slide-fb { background: #2A2D33; padding: 0; }
  .slide-fb .fb-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  /* 底部压暗渐变,保证文字可读 */
  .slide-fb .fb-scrim {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    background: linear-gradient(180deg,
      rgba(20, 24, 32, 0) 0%,
      rgba(20, 24, 32, 0.55) 55%,
      rgba(20, 24, 32, 0.82) 100%);
    z-index: 2;
  }
  .slide-fb .fb-brand .square,
  .slide-fb .fb-brand .line { background: rgba(255,255,255,0.55); }
  .slide-fb .fb-brand .text { color: rgba(255,255,255,0.75); }
  /* 顶部章节标签 */
  .slide-fb .fb-tag {
    position: absolute;
    top: 52px;
    right: 80px;
    z-index: 4;
    font-family: var(--font-en);
    font-size: 13px;
    font-weight: var(--fw-en);
    letter-spacing: 3px;
    color: rgba(255,255,255,0.85);
    background: var(--ch-accent, var(--brand-primary));
    padding: 8px 18px;
  }
  /* 底部信息 */
  .slide-fb .fb-info {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 70px;
    z-index: 3;
    color: #fff;
  }
  .slide-fb .fb-bar {
    width: 64px;
    height: 5px;
    background: var(--ch-accent, var(--brand-accent));
    margin-bottom: 22px;
  }
  .slide-fb .fb-title {
    font-family: var(--font-cn);
    font-size: 44px;
    font-weight: var(--fw-title);
    line-height: 1.25;
    margin-bottom: 14px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .slide-fb .fb-caption {
    font-size: 17px;
    line-height: 1.8;
    color: rgba(255,255,255,0.88);
    max-width: 1100px;
  }
  .slide-fb .fb-page {
    position: absolute;
    bottom: 40px;
    right: 60px;
    z-index: 4;
    font-family: var(--font-en);
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }
  .slide-fb .fb-page .current {
    font-size: 20px;
    font-weight: var(--fw-title);
    color: #fff;
    margin-right: 4px;
  }
  .slide-fb .fb-empty {
    position: absolute;
    inset: 0;
    z-index: 1;
    padding: 200px 100px 120px;
    background: var(--c-bg-page);
  }
</style>
</head>
<body>
<div class="slide slide-fb">
  {{#image}}<img class="fb-img" src="{{ image }}" alt="{{ title }}">{{/image}}
  {{^image}}<div class="fb-empty"><div class="ph-frame">
    <svg class="ph-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="6" y="12" width="52" height="40" rx="3"/>
      <circle cx="22" cy="26" r="4"/>
      <path d="M6 44l16-14 12 10 8-7 16 13"/>
    </svg>
    <div class="ph-title">全屏配图位</div>
    <div class="ph-hint">图片放入 assets/images/ 后,在 deck.yaml 本页 data 填写 image 路径,建议横版高清图</div>
  </div></div>{{/image}}
  <div class="fb-scrim"></div>
  <div class="brand-mark fb-brand">
    <span class="square"></span><span class="line"></span>
    <span class="text">{{ project_name_en }}</span>
  </div>
  {{#tag}}<div class="fb-tag">{{ tag }}</div>{{/tag}}
  <div class="fb-info">
    <div class="fb-bar"></div>
    <div class="fb-title">{{ title }}</div>
    {{#caption}}<div class="fb-caption">{{ caption }}</div>{{/caption}}
  </div>
  <div class="fb-page"><span class="current">{{ page_num }}</span>/{{ total_pages }}</div>
</div>
</body>
</html>
