<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>目录</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #1E2A38;
    --brand-secondary: #2B4C7E;
    --brand-accent: #E87D2B;
    --brand-accent_bright: #F0975A;
    --brand-accent_light: #F5B586;
    --brand-accent_lighter: #FAD3B5;
    --brand-accent_lightest: #FDEAE0;
    --brand-accent_warm: #E87D2B;
    --brand-accent_warm_light: #F5B586;
    --c-black: #1A1A1A;
    --c-text_secondary: #76808C;
    --c-divider: #D5D8D2;
    --c-card_border: #E3E6E0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F4F5F3;
    --c-bg_page_deep: #EDEFEA;
    --c-white: #FFFFFF;
    --c-semantic_success: #2D5F5D;
    --c-semantic_warning: #E87D2B;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: var(--brand-primary);
}

  .slide-toc {
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .slide-toc .toc-title {
    font-family: var(--font-en);
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--c-text-secondary);
    margin-bottom: 60px;
    text-transform: uppercase;
  }
  .slide-toc .toc-list { list-style: none; }
  .slide-toc .toc-item {
    display: flex;
    align-items: center;
    padding: 24px 0;
    border-bottom: 1px solid var(--c-card-border);
    position: relative;
  }
  .slide-toc .toc-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--brand-accent);
    opacity: 0.6;
  }
  .slide-toc .toc-num {
    font-family: var(--font-en);
    font-size: 36px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    width: 80px;
    opacity: 0.8;
  }
  .slide-toc .toc-info { flex: 1; padding-left: 20px; }
  .slide-toc .toc-name {
    font-size: 24px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    margin-bottom: 4px;
  }
  .slide-toc .toc-en {
    font-family: var(--font-en);
    font-size: 13px;
    color: var(--c-text-secondary);
    letter-spacing: 1px;
  }
  .slide-toc .toc-pages {
    font-family: var(--font-en);
    font-size: 14px;
    color: var(--c-text-secondary);
  }
  /* 空页码列自动隐藏（2026-10-16 规则：目录不再标注页码范围） */
  .slide-toc .toc-pages:empty { display: none; }

</style>
</head>
<body>
<div class="slide slide-toc">
  <div class="brand-mark">
    <span class="square"></span>
    <span class="line"></span>
    <span class="text">Anyue Footwear & Apparel Industrial Park Phase IV</span>
  </div>
  <div class="toc-title">CONTENTS</div>
  <ul class="toc-list">
    
    <li class="toc-item">
      <div class="toc-num">01</div>
      <div class="toc-info">
        <div class="toc-name">场地研判</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">02</div>
      <div class="toc-info">
        <div class="toc-name">产业洞察</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">03</div>
      <div class="toc-info">
        <div class="toc-name">概念主旨</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">04</div>
      <div class="toc-info">
        <div class="toc-name">案例佐证</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">05</div>
      <div class="toc-info">
        <div class="toc-name">设计愿景</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">06</div>
      <div class="toc-info">
        <div class="toc-name">方案呈现</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">07</div>
      <div class="toc-info">
        <div class="toc-name">指标与技术分析</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
    <li class="toc-item">
      <div class="toc-num">08</div>
      <div class="toc-info">
        <div class="toc-name">结尾</div>
        <div class="toc-en"></div>
      </div>
      <div class="toc-pages"></div>
    </li>
    
  </ul>
</div>
</body>
</html>
