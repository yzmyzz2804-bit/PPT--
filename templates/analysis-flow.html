<!--
@template: analysis-flow
@source: 新增分析页
@slot: ch5 (技术策略) / ch6 (形态过渡)
@description: 流程图 - 横向阶段卡片+箭头连接,适合表达"从X到Y"的过程
@required_fields: tag, title, subtitle, stages (array of {name, name_en, desc})
@coze_inherit: false
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link rel="stylesheet" href="../base.css">
<style>
  .slide.flow .flow-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    height: 100%;
  }
  .slide.flow .stage {
    flex: 1;
    background: var(--c-bg-card);
    border: 1px solid var(--c-card-border);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 0 12px;
  }
  .slide.flow .stage:first-child { margin-left: 0; }
  .slide.flow .stage:last-child  { margin-right: 0; }
  .slide.flow .stage::after {
    content: '→';
    position: absolute;
    right: -22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 24px;
    color: var(--brand-accent);
    font-weight: var(--fw-title);
    z-index: 5;
  }
  .slide.flow .stage:last-child::after { content: ''; }
  .slide.flow .stage-num {
    font-family: var(--font-en);
    font-size: 14px;
    font-weight: var(--fw-en);
    color: var(--brand-accent);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .slide.flow .stage-name {
    font-size: 20px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    margin-bottom: 4px;
  }
  .slide.flow .stage-en {
    font-family: var(--font-en);
    font-size: 12px;
    color: var(--c-text-secondary);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .slide.flow .stage-desc {
    font-size: 13px;
    color: var(--brand-primary);
    opacity: 0.85;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="slide flow">
  <div class="brand-mark">
    <span class="square"></span><span class="line"></span>
    <span class="text">{{ project_name_en }}</span>
  </div>
  <div class="page-header">
    <div class="page-tag">{{ tag }}</div>
    <div class="page-title">{{ title }}</div>
    <div class="page-subtitle">{{ subtitle }}</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="flow-row">
      {{#stages}}
      <div class="stage">
        <div class="stage-num">STEP {{ @index_1 }}</div>
        <div class="stage-name">{{ name }}</div>
        <div class="stage-en">{{ name_en }}</div>
        <div class="stage-desc">{{ desc }}</div>
      </div>
      {{/stages}}
    </div>
  </div>
  <div class="page-number"><span class="current">{{ page_num }}</span>/{{ total_pages }}</div>
</div>
</body>
</html>
