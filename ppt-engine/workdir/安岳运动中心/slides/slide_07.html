<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生命周期打造</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #1A1A2E;
    --brand-secondary: #1A1A2E;
    --brand-accent: #3E8F7D;
    --brand-accent_bright: #4EA893;
    --brand-accent_light: #7FC3B3;
    --brand-accent_lighter: #A8D8CC;
    --brand-accent_lightest: #D2EBE4;
    --brand-accent_warm: #F5C842;
    --brand-accent_warm_light: #F8DA7A;
    --c-black: #1A1A2E;
    --c-text_secondary: #6B7280;
    --c-divider: #D5DEE8;
    --c-card_border: #E1E8F0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F0F4F8;
    --c-bg_page_deep: #E8EEF4;
    --c-white: #FFFFFF;
    --c-semantic_success: #3E8F7D;
    --c-semantic_warning: #F5C842;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #E0A800;
}

  .slide.fulltext { position: relative; }
  .slide.fulltext::before {
    content: '';
    position: absolute;
    width: 820px; height: 820px;
    bottom: -360px; left: -300px;
    background: radial-gradient(circle, var(--ch-accent, var(--brand-primary)) 0%, transparent 68%);
    opacity: 0.06;
    pointer-events: none;
  }
  .slide.fulltext .ft-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    gap: 40px;
  }
  /* 主题句 / 公式条 */
  .slide.fulltext .ft-formula {
    font-family: var(--font-cn);
    font-size: 46px;
    font-weight: var(--fw-title);
    line-height: 1.4;
    color: var(--brand-primary);
    letter-spacing: 2px;
    padding-left: 32px;
    border-left: 6px solid var(--ch-accent, var(--brand-primary));
  }
  .slide.fulltext .ft-formula .ft-hl {
    color: var(--ch-accent, var(--brand-primary));
    font-weight: var(--fw-title);
  }
  /* 论述段落 */
  .slide.fulltext .ft-paras {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 28px;
  }
  .slide.fulltext .ft-para {
    background: var(--c-bg-card);
    border: 1px solid var(--c-card-border);
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: var(--shadow-card);
  }
  .slide.fulltext .ft-label {
    font-family: var(--font-cn);
    font-size: 21px;
    font-weight: var(--fw-title);
    color: var(--ch-accent, var(--brand-primary));
    margin-bottom: 14px;
  }
  .slide.fulltext .ft-text {
    font-size: 18px;
    line-height: 1.9;
    color: var(--brand-primary);
    opacity: 0.86;
  }
  /* 无 label 段落: 单栏居中大字弱卡 */
  .slide.fulltext .ft-para.plain {
    background: transparent;
    border: none;
    border-left: 3px solid var(--c-divider);
    border-radius: 0;
    box-shadow: none;
    padding: 8px 0 8px 28px;
    text-align: left;
  }
  .slide.fulltext .ft-para.plain .ft-text {
    font-size: 20px;
    line-height: 1.9;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div class="slide fulltext">
  <div class="brand-mark">
    <span class="square"></span><span class="line"></span>
    <span class="text">Anyue Sports Center Architectural Concept Design</span>
  </div>
  <div class="page-header">
    <div class="page-tag">SELF-SUSTAINING LIFECYCLE</div>
    <div class="page-title">生命周期打造</div>
    <div class="page-subtitle"></div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="ft-wrap">
      <div class="ft-formula">造血 = 功能转换 × 业态复合 × 运营模式</div>
      <div class="ft-paras">
        
        <div class="ft-para plain">
          
          <div class="ft-text">不是建一座馆等人来，而是给一座百万人的县，造一个持续运转、不断自造血液的健康引擎。</div>
        </div>
        
      </div>
    </div>
  </div>
  <div class="page-number"><span class="current">7</span>/12</div>
</div>
</body>
</html>
