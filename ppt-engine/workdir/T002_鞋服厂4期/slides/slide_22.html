<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念落盘：从词到园</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #1E2A38;
    --brand-secondary: #2B4C7E;
    --brand-accent: #E87D2B;
    --brand-accent_bright: #F0975A;
    --brand-accent_light: #F5B586;
    --brand-accent_lighter: #FAD3B5;
    --brand-accent_lightest: #FDEAE0;
    --brand-accent_warm: #E87D2B;
    --brand-accent_warm_light: #F5B586;
    --c-black: #1A1A1A;
    --c-text_secondary: #76808C;
    --c-divider: #D5D8D2;
    --c-card_border: #E3E6E0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F4F5F3;
    --c-bg_page_deep: #EDEFEA;
    --c-white: #FFFFFF;
    --c-semantic_success: #2D5F5D;
    --c-semantic_warning: #E87D2B;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #2B4C7E;
}

  .slide.fulltext { position: relative; }
  .slide.fulltext::before {
    content: '';
    position: absolute;
    width: 820px; height: 820px;
    bottom: -360px; left: -300px;
    background: radial-gradient(circle, var(--ch-accent, var(--brand-primary)) 0%, transparent 68%);
    opacity: 0.06;
    pointer-events: none;
  }
  .slide.fulltext .ft-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    gap: 40px;
  }
  /* 主题句 / 公式条 */
  .slide.fulltext .ft-formula {
    font-family: var(--font-cn);
    font-size: 46px;
    font-weight: var(--fw-title);
    line-height: 1.4;
    color: var(--brand-primary);
    letter-spacing: 2px;
    padding-left: 32px;
    border-left: 6px solid var(--ch-accent, var(--brand-primary));
  }
  .slide.fulltext .ft-formula .ft-hl {
    color: var(--ch-accent, var(--brand-primary));
    font-weight: var(--fw-title);
  }
  /* 论述段落 */
  .slide.fulltext .ft-paras {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 28px;
  }
  .slide.fulltext .ft-para {
    background: var(--c-bg-card);
    border: 1px solid var(--c-card-border);
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: var(--shadow-card);
  }
  .slide.fulltext .ft-label {
    font-family: var(--font-cn);
    font-size: 21px;
    font-weight: var(--fw-title);
    color: var(--ch-accent, var(--brand-primary));
    margin-bottom: 14px;
  }
  .slide.fulltext .ft-text {
    font-size: 19px;
    line-height: 1.9;
    color: var(--brand-primary);
    opacity: 0.86;
  }
  /* 无 label 段落: 单栏居中大字弱卡 */
  .slide.fulltext .ft-para.plain {
    background: transparent;
    border: none;
    border-left: 3px solid var(--c-divider);
    border-radius: 0;
    box-shadow: none;
    padding: 8px 0 8px 28px;
    text-align: left;
  }
  .slide.fulltext .ft-para.plain .ft-text {
    font-size: 20px;
    line-height: 1.9;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div class="slide fulltext">
  <div class="brand-mark">
    <span class="square"></span><span class="line"></span>
    <span class="text">Anyue Footwear & Apparel Industrial Park Phase IV</span>
  </div>
  <div class="page-header">
    <div class="page-tag">08 · CLOSING · 落盘收束</div>
    <div class="page-title">概念落盘：从词到园</div>
    <div class="page-subtitle">From Words to Park</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="ft-wrap">
      
      <div class="ft-paras">
        
        <div class="ft-para plain">
          <div class="ft-label">独立成园</div>
          <div class="ft-text">入口昭示与验厂达标，让每家鞋企拥有自己的园区</div>
        </div>
        
        <div class="ft-para plain">
          <div class="ft-label">共享配套</div>
          <div class="ft-text">中央公共进入空间与统一水电管理，让大园区资源被充分利用</div>
        </div>
        
        <div class="ft-para plain">
          <div class="ft-label">梯度生长</div>
          <div class="ft-text">可分可合与弹性加建，让企业跟着园区一起长大</div>
        </div>
        
      </div>
    </div>
  </div>
  <div class="page-number"><span class="current">22</span>/23</div>
</div>
</body>
</html>
