<!--
@template: big-quote
@version: 1.0 分章色体系
@slot: ch_*
@description: 大字概念页 - 居中大字主张 + 副文,下方可选 2-3 个概念支柱(词/定位/要点),适合概念主旨/核心策略
@required_fields: title, quote_main
@optional_fields: tag, quote_sub, pillars (array of {word, role, points}), quote_from
@image_rule: 无图纯排版
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link rel="stylesheet" href="../base.css">
<style>
  .slide-bq {
    background: var(--c-bg-page);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  /* 章节色淡晕背景 */
  .slide-bq::before {
    content: '';
    position: absolute;
    width: 900px;
    height: 900px;
    top: -380px;
    right: -260px;
    background: radial-gradient(circle, var(--ch-accent, var(--brand-primary)) 0%, transparent 68%);
    opacity: 0.05;
    pointer-events: none;
  }
  .slide-bq .bq-head {
    margin-top: 210px;
    text-align: center;
    padding: 0 140px;
  }
  .slide-bq .bq-mark {
    font-family: var(--font-en);
    font-size: 120px;
    font-weight: 700;
    line-height: 0.5;
    color: var(--ch-accent, var(--brand-primary));
    opacity: 0.28;
    display: block;
    margin-bottom: 44px;
  }
  .slide-bq .bq-main {
    font-family: var(--font-cn);
    font-size: 76px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    line-height: 1.3;
    letter-spacing: 10px;
    margin-bottom: 26px;
  }
  .slide-bq .bq-main .bq-sep {
    color: var(--ch-accent, var(--brand-primary));
    font-weight: 400;
    margin: 0 8px;
  }
  .slide-bq .bq-sub {
    font-size: 19px;
    line-height: 1.9;
    color: var(--c-text-secondary);
    max-width: 1000px;
    margin: 0 auto;
  }
  /* 概念支柱 */
  .slide-bq .bq-pillars {
    display: flex;
    gap: 32px;
    margin-top: 64px;
    padding: 0 100px;
  }
  .slide-bq .bq-pillars:empty { display: none; }
  .slide-bq .pl-col {
    flex: 1;
    background: var(--c-bg-card);
    border: 1px solid var(--c-card-border);
    border-top: 4px solid var(--ch-accent, var(--brand-primary));
    border-radius: var(--radius);
    padding: 34px 36px 32px;
  }
  .slide-bq .pl-word {
    font-family: var(--font-cn);
    font-size: 40px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    margin-bottom: 8px;
  }
  .slide-bq .pl-role {
    font-size: 15px;
    font-weight: var(--fw-title);
    color: var(--ch-accent, var(--brand-primary));
    letter-spacing: 1px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--c-card-border);
  }
  .slide-bq .pl-points {
    list-style: none;
  }
  .slide-bq .pl-points li {
    font-size: 14px;
    line-height: 1.7;
    color: var(--c-text-secondary);
    padding: 5px 0 5px 16px;
    position: relative;
  }
  .slide-bq .pl-points li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 13px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ch-accent, var(--brand-primary));
  }
  .slide-bq .bq-from {
    position: absolute;
    bottom: 92px;
    font-family: var(--font-en);
    font-size: 13px;
    font-weight: var(--fw-en);
    letter-spacing: 4px;
    color: var(--c-text-secondary);
  }
</style>
</head>
<body>
<div class="slide slide-bq">
  <div class="brand-mark">
    <span class="square"></span><span class="line"></span>
    <span class="text">{{ project_name_en }}</span>
  </div>
  <div class="bq-head">
    <span class="bq-mark">&ldquo;</span>
    <div class="bq-main">{{ quote_main }}</div>
    {{#quote_sub}}<div class="bq-sub">{{ quote_sub }}</div>{{/quote_sub}}
  </div>
  <div class="bq-pillars">
    {{#pillars}}
    <div class="pl-col">
      <div class="pl-word">{{ word }}</div>
      {{#role}}<div class="pl-role">{{ role }}</div>{{/role}}
      <ul class="pl-points">
        {{#points}}<li>{{ . }}</li>{{/points}}
      </ul>
    </div>
    {{/pillars}}
  </div>
  {{#quote_from}}<div class="bq-from">{{ quote_from }}</div>{{/quote_from}}
  <div class="page-number"><span class="current">{{ page_num }}</span>/{{ total_pages }}</div>
</div>
</body>
</html>
