<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>经济技术指标</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #0E2A5B;
    --brand-secondary: #1D3A8A;
    --brand-accent: #2562EB;
    --brand-accent_bright: #3B81F5;
    --brand-accent_light: #60A5FA;
    --brand-accent_lighter: #93C4FD;
    --brand-accent_lightest: #BEDAFE;
    --brand-accent_warm: #D9822B;
    --brand-accent_warm_light: #F0A860;
    --c-black: #1A1A1A;
    --c-text_secondary: #8A8F98;
    --c-divider: #D8D4CC;
    --c-card_border: #E8E4DC;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F3F1ED;
    --c-bg_page_deep: #EEECE9;
    --c-white: #FFFFFF;
    --c-semantic_success: #049569;
    --c-semantic_warning: #D9822B;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #3A3A40;
}

  .slide.multi-card { position: relative; }
  .slide.multi-card .page-bg {
    position: absolute; inset: 0; background-size: cover;
    background-position: center; z-index: 0;
  }
  .slide.multi-card .page-bg-overlay {
    position: absolute; inset: 0; background: rgba(14, 27, 59, 0.65);
    z-index: 1;
  }
  .slide.multi-card .brand-mark,
  .slide.multi-card .page-header,
  .slide.multi-card .slide-content,
  .slide.multi-card .page-number { z-index: 3; }
  .slide.multi-card .slide-content {
    display: flex; flex-direction: column; gap: 24px;
  }
  .slide.multi-card .row-data,
  .slide.multi-card .row-photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px; flex: 1;
  }
  .slide.multi-card .row-photos:empty,
  .slide.multi-card .row-data:empty { display: none; }
  /* 无大数字的纯文字卡: 隐藏空数字行,避免顶部空洞 */
  .slide.multi-card .data-number:empty,
  .slide.multi-card .data-unit:empty { display: none; }
  .slide.multi-card .data-card:has(.data-number:empty) {
    display: flex; flex-direction: column; justify-content: center;
  }
  .slide.multi-card .photo-card {
    display: flex; flex-direction: column;
  }
  .slide.multi-card .photo-card img {
    width: 100%; flex: 1; min-height: 240px;
    object-fit: cover;
  }
  .slide.multi-card .photo-card .ph-frame {
    flex: 1; min-height: 240px; border: none;
  }
</style>
</head>
<body>
<div class="slide multi-card">
  <div class="page-bg" style="background-image: url('../assets/images/site/masterplan_aerial.jpg')"></div>
  <div class="page-bg-overlay"></div>
  <div class="brand-mark">
    <span class="square"></span>
    <span class="line"></span>
    <span class="text">Anyue Chemical Park Command Center Architectural Design</span>
  </div>
  <div class="page-header">
    <div class="page-tag"></div>
    <div class="page-title">经济技术指标</div>
    <div class="page-subtitle">Economic & Technical Indicators</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="row-data">
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 10,000㎡</div>
        <div class="data-unit">（约15亩）</div>
        <div class="data-label">总用地面积</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 2,800㎡</div>
        <div class="data-unit"></div>
        <div class="data-label">建筑基底面积</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 25%</div>
        <div class="data-unit"></div>
        <div class="data-label">场地绿地率</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 0.85</div>
        <div class="data-unit"></div>
        <div class="data-label">容积率</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 8,500㎡</div>
        <div class="data-unit"></div>
        <div class="data-label">总建筑面积</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 6,000㎡</div>
        <div class="data-unit"></div>
        <div class="data-label">保留建筑面积</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 2,500㎡</div>
        <div class="data-unit"></div>
        <div class="data-label">新增建筑面积</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">地上3层 + 加建层</div>
        <div class="data-unit"></div>
        <div class="data-label">建筑层数</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 45%</div>
        <div class="data-unit"></div>
        <div class="data-label">办公/指挥</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 20%</div>
        <div class="data-unit"></div>
        <div class="data-label">展示/会议</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 20%</div>
        <div class="data-unit"></div>
        <div class="data-label">宿舍/配套</div>
        <div class="data-items">
          
        </div>
      </div>
      
      <div class="card data-card card-accent-top">
        <div class="data-number">约 15%</div>
        <div class="data-unit"></div>
        <div class="data-label">设备/车库</div>
        <div class="data-items">
          
        </div>
      </div>
      
    </div>
    <div class="row-photos">
      
    </div>
  </div>
  <div class="page-number"><span class="current">23</span>/25</div>
</div>
</body>
</html>
