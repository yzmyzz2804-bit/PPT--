    --brand-secondary: #1A1A2E;

    --brand-accent_bright: #4EA893;
    --brand-accent_light: #7FC3B3;
    --brand-accent_lighter: #A8D8CC;
    --brand-accent_lightest: #D2EBE4;
    --brand-accent_warm: #F5C842;
    --brand-accent_warm_light: #F8DA7A;
    --c-black: #1A1A2E;
    --c-text_secondary: #6B7280;
    --c-divider: #D5DEE8;
    --c-card_border: #E1E8F0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F0F4F8;
    --c-bg_page_deep: #E8EEF4;
    --c-white: #FFFFFF;
    --c-semantic_success: #3E8F7D;
    --c-semantic_warning: #F5C842;

    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;

  .slide.split .slide-content { padding: 0; }
  .slide.split .split-layout { gap: 48px; }
  .slide.split .split-left {
    display: flex; flex-direction: column; gap: 20px;
  }
  .slide.split .split-left .split-main { flex: 3; min-height: 0; display: flex; }
  .slide.split .split-left .split-main img,
  .slide.split .split-left .split-main .ph-frame { width: 100%; height: 100%; }
  .slide.split .split-left .split-second { flex: 2; min-height: 0; display: flex; }
  .slide.split .split-left .split-second img {
    width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius);
  }
  .slide.split .split-left .split-second .ph-frame { width: 100%; height: 100%; min-height: 0; }
  .slide.split .split-left .ph-frame { min-height: 100%; }
</style>
</head>
<body>
<div class="slide split">
  <div class="brand-mark">
    <span class="square"></span>
    <span class="line"></span>
    <span class="text">Anyue Sports Center Architectural Concept Design</span>
  </div>
  <div class="page-header">
    <div class="page-tag">CULTURE · NATURE · CONCEPT</div>
    <div class="page-title">一条文化根，一面湖山水</div>
    <div class="page-subtitle">A Cultural Root, A Lakeside Landscape</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="split-layout ">
      <div class="split-left">
        <div class="split-main">
        <img src="../assets/images/culture/grotto_bg.jpg" alt="一条文化根，一面湖山水">
        
        </div>
        <div class="split-second"><img src="../assets/images/site/site_aerial.jpg" alt=""></div>
      </div>
      <div class="split-right">
        
        <div class="card card-accent-left">
          <div class="card-title">核心逻辑</div>
          <div class="card-text">文化定形，自然定境——两条副线，一条主线（健康）贯穿</div>
        </div>
        
        <div class="card card-accent-left">
          <div class="card-title">文化 · 定形</div>
          <div class="card-text">安岳石刻——石的质感、窟的光影、线的流动，是建筑定「形」的母题</div>
        </div>
        
        <div class="card card-accent-left">
          <div class="card-title">自然 · 定境</div>
          <div class="card-text">滴水湖——三面隐、一面开，是建筑定「境」的母题</div>
        </div>
        
      </div>
    </div>
  </div>
  <div class="page-number"><span class="current">3</span>/12</div>
</div>
