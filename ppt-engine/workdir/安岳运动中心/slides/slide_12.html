<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>只在此山中 · 云深不知处</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #1A1A2E;
    --brand-secondary: #1A1A2E;
    --brand-accent: #3E8F7D;
    --brand-accent_bright: #4EA893;
    --brand-accent_light: #7FC3B3;
    --brand-accent_lighter: #A8D8CC;
    --brand-accent_lightest: #D2EBE4;
    --brand-accent_warm: #F5C842;
    --brand-accent_warm_light: #F8DA7A;
    --c-black: #1A1A2E;
    --c-text_secondary: #6B7280;
    --c-divider: #D5DEE8;
    --c-card_border: #E1E8F0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F0F4F8;
    --c-bg_page_deep: #E8EEF4;
    --c-white: #FFFFFF;
    --c-semantic_success: #3E8F7D;
    --c-semantic_warning: #F5C842;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #1A1A2E;
}

  .slide-closing {
    background: var(--c-bg-page);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slide-closing .closing-bg {
    position: absolute;
    inset: 0;
    background-image: url('../assets/bg/closing.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.1;
    z-index: 0;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
  }
  .slide-closing .closing-text,
  .slide-closing .closing-sub,
  .slide-closing .footer { position: relative; z-index: 1; }
  .slide-closing .closing-text {
    font-family: var(--font-cn);
    font-size: 52px;
    font-weight: var(--fw-title);
    color: var(--c-black);
    letter-spacing: 3px;
    margin-bottom: 36px;
    text-align: center;
  }
  .slide-closing .closing-sub {
    font-family: var(--font-cn);
    font-size: 18px;
    color: #555;
    letter-spacing: 4px;
    text-align: center;
    line-height: 1.8;
  }
  .slide-closing .footer {
    position: absolute;
    bottom: 40px;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--font-cn);
    font-size: 13px;
    color: var(--c-text-secondary);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="slide slide-closing">
  <div class="closing-bg"></div>
  <div class="closing-text">只在此山中 · 云深不知处</div>
  <div class="closing-sub">一座藏在山水里、却能自己造血的体育馆，就是安岳人的答案。</div>
  <div class="footer">安岳运动中心建筑概念方案 · 概念方案汇报</div>
</div>
</body>
</html>
