<head>

<title>建筑风格 DNA</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #0E2A5B;
    --brand-secondary: #1D3A8A;
    --brand-accent: #2562EB;
    --brand-accent_bright: #3B81F5;
    --brand-accent_light: #60A5FA;
    --brand-accent_lighter: #93C4FD;
    --brand-accent_lightest: #BEDAFE;
    --brand-accent_warm: #D9822B;
    --brand-accent_warm_light: #F0A860;
    --c-black: #1A1A1A;
    --c-text_secondary: #8A8F98;
    --c-divider: #D8D4CC;
    --c-card_border: #E8E4DC;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F3F1ED;
    --c-bg_page_deep: #EEECE9;
    --c-white: #FFFFFF;
    --c-semantic_success: #049569;
    --c-semantic_warning: #D9822B;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #46526B;
}

  .slide.split .slide-content { padding: 0; }
  .slide.split .split-layout { gap: 48px; }
  .slide.split .split-left {
    display: flex; flex-direction: column; gap: 20px;
  }
  .slide.split .split-left .split-main { flex: 3; min-height: 0; display: flex; }
  .slide.split .split-left .split-main img,
  .slide.split .split-left .split-main .ph-frame { width: 100%; height: 100%; }
  .slide.split .split-left .split-second { flex: 2; min-height: 0; display: flex; }
  .slide.split .split-left .split-second img {
    width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius);
  }
  .slide.split .split-left .split-second .ph-frame { width: 100%; height: 100%; min-height: 0; }
  .slide.split .split-left .ph-frame { min-height: 100%; }
</style>
</head>
<body>
<div class="slide split">
  <div class="brand-mark">
    <span class="square"></span>
    <span class="line"></span>
    <span class="text">Sichuan Nursing Vocational College (Deyang Campus) Planning Adjustment</span>
  </div>
  <div class="page-header">
    <div class="page-tag">五大风格基因</div>
    <div class="page-title">建筑风格 DNA</div>
    <div class="page-subtitle">Architectural Style DNA</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="split-layout ">
      <div class="split-left">
        <div class="split-main">
        <img src="../assets/images/architecture/teaching_building.jpg" alt="建筑风格 DNA">
        
        </div>
        
      </div>
      <div class="split-right">
        
        <div class="card card-accent-left">
          <div class="card-title"></div>
          <div class="card-text">体量性格：敦厚质朴、厚重不笨重，横向舒展，立面有序韵律<br>色彩系统：暖灰/米黄主基调 + 深灰勾勒轮廓 + 木色点缀室内<br>立面母题：规整条窗 + 水平/竖向韵律 + 实墙与玻璃节奏对比<br>入口处理：内凹入口 + 灰空间 + 雨篷挑出，强调"进入"仪式感<br>统一窗系统：全校同款窗（深灰框+等距分格），排列组合形成韵律</div>
        </div>
        
      </div>
    </div>
  </div>
  <div class="page-number"><span class="current">23</span>/26</div>
</div>
