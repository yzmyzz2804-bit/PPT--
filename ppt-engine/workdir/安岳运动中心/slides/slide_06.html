<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>证明「造血」这条路走得通</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
    /* —— theme.json 自动注入 (勿手动改) —— */
    --brand-primary: #1A1A2E;
    --brand-secondary: #1A1A2E;
    --brand-accent: #3E8F7D;
    --brand-accent_bright: #4EA893;
    --brand-accent_light: #7FC3B3;
    --brand-accent_lighter: #A8D8CC;
    --brand-accent_lightest: #D2EBE4;
    --brand-accent_warm: #F5C842;
    --brand-accent_warm_light: #F8DA7A;
    --c-black: #1A1A2E;
    --c-text_secondary: #6B7280;
    --c-divider: #D5DEE8;
    --c-card_border: #E1E8F0;
    --c-bg_card: #FFFFFF;
    --c-bg_page: #F0F4F8;
    --c-bg_page_deep: #E8EEF4;
    --c-white: #FFFFFF;
    --c-semantic_success: #3E8F7D;
    --c-semantic_warning: #F5C842;
    --font-cn: Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif;
    --font-en: Arial, Helvetica, Inter, sans-serif;
    --font-num: Arial, Helvetica, Inter, sans-serif;
    --fs-mega_title: 84px;
    --fs-hero_title: 56px;
    --fs-title: 34px;
    --fs-card_title: 22px;
    --fs-body: 17px;
    --fs-caption: 13px;
    --fs-en_label: 13px;
    --slide-w: 1920px;
    --slide-h: 1080px;
    --safe-margin: 80px;
    --ch-accent: #2E7D6E;
}

  .slide.cmp-table .cmp-table-el {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--c-white);
    box-shadow: var(--shadow-card);
  }
  .slide.cmp-table .cmp-table-el th {
    background: var(--brand-secondary);
    color: var(--c-white);
    font-weight: var(--fw-title);
    padding: 14px 20px;
    text-align: left;
    font-size: 15px;
  }
  .slide.cmp-table .cmp-table-el th.col-hot {
    background: var(--brand-accent);
  }
  .slide.cmp-table .cmp-table-el td {
    padding: 10px 20px;
    border-bottom: 1px solid var(--c-card-border);
    color: var(--brand-primary);
  }
  .slide.cmp-table .cmp-table-el tr:nth-child(even) td {
    background: #F7F5F1;
  }
  .slide.cmp-table .cmp-table-el td.ind { color: var(--c-text-secondary); }
  .slide.cmp-table .cmp-table-el td.hot { font-weight: var(--fw-num); }
  .slide.cmp-table .cmp-table-el td.hot .better { color: var(--brand-accent); }
  .slide.cmp-table .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
    margin-top: 24px;
  }
  .slide.cmp-table .sum-card {
    background: var(--c-white);
    border-top: 3px solid var(--brand-primary);
    box-shadow: var(--shadow-card);
    padding: 20px 24px;
  }
  .slide.cmp-table .sum-card.hot { border-top-color: var(--brand-accent); }
  .slide.cmp-table .sum-name {
    font-size: 18px;
    font-weight: var(--fw-title);
    color: var(--brand-primary);
    margin-bottom: 12px;
  }
  .slide.cmp-table .sum-item {
    display: flex;
    gap: 10px;
    font-size: 13px;
    padding: 4px 0;
    color: var(--brand-primary);
  }
  .slide.cmp-table .sum-k {
    color: var(--c-text-secondary);
    flex-shrink: 0;
  }
  /* 可选案例实景图条 */
  .slide.cmp-table .case-images {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .slide.cmp-table .case-images:empty { display: none; }
  .slide.cmp-table .case-images figure {
    position: relative;
    height: 180px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--c-card-border);
    background: var(--c-bg-card);
  }
  .slide.cmp-table .case-images img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .slide.cmp-table .case-images .cap {
    position: absolute;
    left: 0; bottom: 0;
    padding: 8px 16px;
    background: rgba(26, 26, 46, 0.74);
    color: var(--c-white);
    font-size: 14px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="slide cmp-table">
  <div class="brand-mark">
    <span class="square"></span><span class="line"></span>
    <span class="text">Anyue Sports Center Architectural Concept Design</span>
  </div>
  <div class="page-header">
    <div class="page-tag">HOW & PROOF</div>
    <div class="page-title">证明「造血」这条路走得通</div>
    <div class="page-subtitle">Proof that Self-sustaining Works</div>
    <div class="title-line"></div>
  </div>
  <div class="slide-content">
    <div class="case-images">
      
      <figure>
        <img src="../assets/images/case/jiaxing_sports.jpg" alt="嘉兴时尚体育中心">
        <div class="ph-frame" style="height:100%;min-height:0;border:none"></div>
        <figcaption class="cap">嘉兴时尚体育中心</figcaption>
      </figure>
      
      <figure>
        <img src="../assets/images/case/shandong_stadium.jpg" alt="山东第一医科大学文体中心">
        <div class="ph-frame" style="height:100%;min-height:0;border:none"></div>
        <figcaption class="cap">山东第一医科大学文体中心</figcaption>
      </figure>
      
    </div>
    <table class="cmp-table-el">
      <tr>
        <th style="width:26%">维度</th>
        <th class="col-hot" style="width:36%">嘉兴时尚体育中心</th>
        <th style="width:38%">山东第一医科大学文体中心</th>
      </tr>
      
      <tr>
        <td class="ind">定位</td>
        <td class="hot">运动活力 MALL + 一专多能<span class="better"> ◂</span></td>
        <td>扁长双体量 + 二层平台</td>
      </tr>
      
      <tr>
        <td class="ind">设计方</td>
        <td class="hot">浙江大学建筑设计研究院<span class="better"> ◂</span></td>
        <td>顾志宏工作室</td>
      </tr>
      
      <tr>
        <td class="ind">核心引证</td>
        <td class="hot">明确以「运维过程中的自我造血」为目标<span class="better"> ◂</span></td>
        <td>县域扁长场馆的成熟做法</td>
      </tr>
      
      <tr>
        <td class="ind">对安岳启示</td>
        <td class="hot">全生命周期运营是落盘的起点<span class="better"> ◂</span></td>
        <td>扁长体量 + 平台是可靠原型</td>
      </tr>
      
    </table>
    <div class="summary-row">
      
      <div class="sum-card hot">
        <div class="sum-name">落点</div>
        
        <div class="sum-item"><span class="sum-k"></span><span>概念不止于形态，更要落到「如何持续运转」。</span></div>
        
      </div>
      
    </div>
  </div>
  <div class="page-number"><span class="current">6</span>/12</div>
</div>
</body>
</html>
